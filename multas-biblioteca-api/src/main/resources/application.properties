# application.properties
spring.application.name=multas-biblioteca-api
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=TRACE

spring.datasource.url=jdbc:h2:mem:multas_biblioteca_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Cambiar a "wompi" activa WompiAdapter en su lugar; MultaService no se toca.
app.pagos.proveedor=pagosufps
app.pagos.pagosudes.url=http://localhost:9001/pagosufps/transacciones
app.pagos.wompi.url=http://localhost:9002/wompi/transactions
server.port=8080